# Training configuration.
# [shared] is the fairness contract: every model is trained with exactly these values.
# Values marked PROVISIONAL are fixed after the pilot run measures speed and GPU memory.

[shared]
seed = 0
patch_size = [96, 96, 96]      # see docs/decisions/0002-preprocessing.md
samples_per_case = 4           # patches drawn from each training case per step
cases_per_batch = 2            # so 8 patches per optimizer step (PROVISIONAL)
learning_rate = 1e-4
weight_decay = 1e-5
max_steps = 2000               # training budget, counted in optimizer steps (PROVISIONAL)
val_every_steps = 100          # validation and checkpoint selection interval (PROVISIONAL)
num_workers = 0                # data loading in the main process (safe on Windows)
amp = true                     # mixed precision on GPU; always off on CPU

[models.baseline]
architecture = "unet3d"        # src/spleenseg/model.py
channels = [16, 32, 64, 128]
