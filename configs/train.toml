# Training configuration.
# [shared] is the fairness contract: every model is trained with exactly these values.
# Batch and budget were fixed from a 60-step pilot measuring speed and GPU memory on an
# RTX 4060 Laptop GPU (8 GB), never from validation scores.

[shared]
seed = 0
patch_size = [96, 96, 96]      # see docs/decisions/0002-preprocessing.md
samples_per_case = 4           # patches drawn from each training case per step
cases_per_batch = 2            # 8 patches per step: fits the baseline and the T06 candidate
learning_rate = 1e-4
weight_decay = 1e-5
max_steps = 5000               # training budget in optimizer steps: baseline estimated at ~1.5 h
val_every_steps = 250          # 20 validations: few checks limit the winner's curse
num_workers = 0                # data loading in the main process (safe on Windows)
amp = true                     # mixed precision on GPU; always off on CPU

[models.baseline]
architecture = "unet3d"        # src/spleenseg/model.py
channels = [16, 32, 64, 128]

[models.monai_unet]
architecture = "monai_unet"    # MONAI's U-Net with residual units, see src/spleenseg/train.py
channels = [16, 32, 64, 128, 256]
