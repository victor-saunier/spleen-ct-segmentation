# CI: on every pull request and every push to main, install the project on a clean Linux
# machine and run all the checks. Branch protection on main requires this job to pass.
# CD: pushing a version tag (v1.2.3) runs the same checks, then publishes the image and a
# GitHub Release (job "publish"). Nothing is published from pull requests or main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# The token GitHub gives this workflow can only read the repository (least privilege).
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A fixed image instead of ubuntu-latest, so the machine does not change under our feet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by full commit hash: a tag like v7 can be moved, a hash cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # we never push from CI, so do not keep the token on disk
          fetch-depth: 0 # full history, needed by the secret scan below

      # The pre-commit hook only scans staged changes, on laptops where it is installed.
      # This scans every commit in the history, so it catches anything that slipped past.
      - name: Scan the full git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Official checksum from the gitleaks release page: proves the download was not altered.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # same uv as on the development laptop
          enable-cache: true # reuse downloaded packages between runs (keyed on uv.lock)

      - name: Install the project from the lockfile
        run: uv sync --locked # fails if uv.lock no longer matches pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # The image is what users run: build it from this commit with the real Dockerfile, so a
      # broken Dockerfile or a file missing from .dockerignore fails CI. No cache: every run
      # builds from scratch on a fresh machine.
      - name: Build the Docker image
        run: docker build -t spleenseg:ci .

      - name: Run tests
        env:
          # Turns on tests/test_docker.py: the container must predict the same mask as the code.
          SPLEENSEG_DOCKER_IMAGE: spleenseg:ci
        run: uv run pytest

  publish:
    # Only for a version tag, and only once every check passed on that same commit.
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Write rights only here, never in the checks job that runs on pull requests.
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to ghcr.io
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rebuilt from the tagged commit on a fresh machine: the locked libraries and the base
      # images pinned by digest give the same contents as the image the checks job tested.
      # Plain docker login with the workflow's own token: no third-party action to trust.
      - name: Build and push the image, create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$image" .
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker logout ghcr.io
          # The digest names this exact content; the tag is only a name that could be moved.
          pinned=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; *) pre="" ;; esac
          cat > notes.md <<NOTES
          Research / portfolio project. **NOT a medical device**: not validated for clinical use.

          Docker image (CPU), by tag and by exact content:

              docker pull ${image}
              docker pull ${pinned}

          The image holds no model weights and no data: mount a model folder and your scans, see
          "Run with Docker" in the README. No model file is released (decision record 0009).
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
