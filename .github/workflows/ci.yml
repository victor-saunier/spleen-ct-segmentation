# CI: on every pull request and every push to main, install the project on a clean Linux
# machine and run all the checks. Branch protection on main requires this job to pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token GitHub gives this workflow can only read the repository (least privilege).
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A fixed image instead of ubuntu-latest, so the machine does not change under our feet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by full commit hash: a tag like v7 can be moved, a hash cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # we never push from CI, so do not keep the token on disk
          fetch-depth: 0 # full history, needed by the secret scan below

      # The pre-commit hook only scans staged changes, on laptops where it is installed.
      # This scans every commit in the history, so it catches anything that slipped past.
      - name: Scan the full git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Official checksum from the gitleaks release page: proves the download was not altered.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # same uv as on the development laptop
          enable-cache: true # reuse downloaded packages between runs (keyed on uv.lock)

      - name: Install the project from the lockfile
        run: uv sync --locked # fails if uv.lock no longer matches pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest
