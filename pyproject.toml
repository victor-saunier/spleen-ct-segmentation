[project]
name = "spleen-ct-segmentation"
version = "0.1.0"
description = "3D spleen segmentation on CT with PyTorch and MONAI (research project, not a medical device)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Saunier" }]
# 3.12 only: the version range supported by PyTorch, MONAI and ONNX Runtime at the same time.
requires-python = ">=3.12,<3.13"
dependencies = [
    "monai>=1.6.1",
    "nibabel>=5.5",
    "torch>=2.15",
]

[dependency-groups]
# Tools for development only, not needed to use the package.
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff==0.17.4", # exact pin: must equal the ruff rev in .pre-commit-config.yaml
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

# PyTorch publishes one build per hardware target on its own package index.
# Windows laptop (RTX 4060): CUDA 13.2 build. Linux (CI, Docker): the much smaller CPU build.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true # only used for packages that ask for it below

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
# Only resolve for the two platforms this project runs on.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.build-backend]
# The import name (`import spleenseg`) differs from the project name, so we state it.
module-name = "spleenseg"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: real errors (syntax, undefined names, unused imports), I: import order,
# B: common bug patterns, UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# Every function must declare its types, so the type hints are checked, not just decoration.
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
