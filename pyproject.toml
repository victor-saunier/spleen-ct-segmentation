[project]
name = "spleen-ct-segmentation"
version = "0.1.0"
description = "3D spleen segmentation on CT with PyTorch and MONAI (research project, not a medical device)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Saunier" }]
# 3.12 only: the version range supported by PyTorch, MONAI and ONNX Runtime at the same time.
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# Tools for development only, not needed to use the package.
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff==0.17.4", # exact pin: must equal the ruff rev in .pre-commit-config.yaml
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name (`import spleenseg`) differs from the project name, so we state it.
module-name = "spleenseg"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: real errors (syntax, undefined names, unused imports), I: import order,
# B: common bug patterns, UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# Every function must declare its types, so the type hints are checked, not just decoration.
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
